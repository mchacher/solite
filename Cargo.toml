[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/host",
  "crates/recipe-sdk",
  "crates/sim",
  "crates/ui-embed",
]
# The ESP32 firmware has its own toolchain (Xtensa) and target: built from firmware/.
exclude = ["firmware", "vendor/rquickjs-sys"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/mchacher/solite"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The password hash (spec 029, D47) runs fast in the debug builds of the tests too.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

# QuickJS (script recipes, spec 041) compiled with optimisation in the debug builds of the tests too.
[profile.dev.package.rquickjs-sys]
opt-level = 3

# rquickjs-sys 0.14.0 with the small-object arena off (about 85 KB less per runtime): see
# vendor/rquickjs-sys/SOLITE.md. The firmware's own workspace patches it too.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
