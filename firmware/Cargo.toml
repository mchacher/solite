[package]
name = "solite-firmware"
description = "Solite on the ESP32 of the Sonoff Dongle Max: the core with the real adapters, on ESP-IDF."
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/mchacher/solite"
# Built with the Xtensa toolchain (rust-toolchain.toml here), outside the Mac workspace.
build = "build.rs"

[[bin]]
name = "solite-firmware"
harness = false # no std test harness on the ESP32: the logic is tested on the Mac, in crates/

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
# The image QEMU runs: the engine with the simulated radio and the realistic home of
# `fixtures/` (spec 016, decision D26). Without it (and without `radio`), the image is the box's:
# it starts no radio.
sim = ["dep:solite-sim", "dep:ed25519-dalek"]
# The measuring image for the box (spec 020): `sim`, but every save goes to the flash, timed, and
# the run logs the `saves:` line. QEMU's flash takes a quarter of an hour for those saves, so only
# the box runs it.
flash-saves = ["sim"]
# The radio image (spec 021, decision D32): drives the EFR32 over UART1 and runs the engine on it.
# Built in its own target folder with `sdkconfig.radio.defaults`; never with `sim`.
radio = ["scripts"]
# Script recipes (spec 041, 042): the core's `script-recipes` (QuickJS through rquickjs) with the
# firmware's PSRAM allocator. No script is built into any image: the box's scripts are installed
# (spec 042); the image QEMU runs (`--features sim,scripts`) reads `recipes/scripts/motion-light.js`
# for its own measures. The radio image carries it, so does the image QEMU runs; the box's own image,
# the measuring image (`flash-saves`) and plain `sim` do not (`scripts/validate.sh` searches their
# ELF for QuickJS, and the radio image's for the script's id).
scripts = ["solite-core/script-recipes", "dep:rquickjs", "dep:serde_json"]

[dependencies]
solite-core = { path = "../crates/core" }
# QuickJS-ng. `bindgen`: the bindings are made for the target (the build variables are in
# `.cargo/config.toml`); `allocator`: a runtime over the firmware's own allocator (PSRAM, D74);
# `parallel`: as in the core.
rquickjs = { version = "=0.14.0", default-features = false, features = ["bindgen", "allocator", "parallel"], optional = true }
solite-sim = { path = "../crates/sim", optional = true }
esp-idf-svc = "0.53"
log = "0.4"
# The QEMU image's script phase reads the realistic home's instances and builds the requests.
serde_json = { version = "1", optional = true }
# Signs the throwaway update files of the QEMU image's stack check (`update_check.rs`, D60).
ed25519-dalek = { version = "3.0", default-features = false, optional = true }

[build-dependencies]
embuild = "0.33"
# The interface packed for the radio image's flash (spec 022 R7, spec 023 R7).
solite-ui-embed = { path = "../crates/ui-embed" }

[lints.rust]
unsafe_code = "deny"

# rquickjs-sys 0.14.0 with the small-object arena off: `vendor/rquickjs-sys/SOLITE.md`. The root
# workspace patches it too.
[patch.crates-io]
rquickjs-sys = { path = "../vendor/rquickjs-sys" }

# Its own workspace, also when the repository is checked out inside another checkout (an agent's
# worktree under .claude/worktrees/), where Cargo would otherwise take the outer workspace.
[workspace]
