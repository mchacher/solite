# The verdict of CLAUDE.md: sh scripts/validate.sh, cut into three jobs that run side by side
# (`--only rust`, `--only ui`, `--only firmware`): together they are exactly the full run, and the
# slowest one sets the time. Pull requests run it scaled to their files (`--pre-merge`); pushes to main with `--skip-slow` (no slow
# Rust test, no QEMU run); every night, and by hand (Run workflow), the full verdict runs on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Empty for the nightly and manual runs (the full verdict), `--skip-slow` otherwise.
  SKIP_SLOW: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '--skip-slow' || '' }}
  # A pull request runs the verdict scaled to its files (`validate.sh --pre-merge`, `scripts/scope.sh`):
  # a group it does not touch is skipped, a critical path runs in full with QEMU. main and the
  # nightly run every group.
  SCOPE: ${{ github.event_name == 'pull_request' && format('--pre-merge --base origin/{0}', github.base_ref) || '' }}

jobs:
  rust:
    name: validate (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust, at the version pinned in rust-toolchain.toml
        run: rustup toolchain install

      # Pinned like the composite action of release.yml: the keys are computed by the same version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          shared-key: rust

      - name: Validate
        run: sh scripts/validate.sh --only rust ${SCOPE:-$SKIP_SLOW}

  ui:
    name: validate (ui)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            tools/z2m-coverage/package-lock.json

      - name: Interface packages
        working-directory: ui
        run: npm ci

      - name: Tools packages
        working-directory: tools/z2m-coverage
        run: npm ci

      - name: Validate
        run: sh scripts/validate.sh --only ui ${SCOPE:-$SKIP_SLOW}

  firmware:
    name: validate (firmware)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ESPUP_VERSION: v0.19.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System packages for ESP-IDF
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-venv

      - name: System libraries for QEMU
        if: env.SKIP_SLOW == '' || github.event_name == 'pull_request'
        run: sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0

      - name: Rust, at the version pinned in rust-toolchain.toml
        run: rustup toolchain install

      # The radio image embeds the built interface (spec 023 R7.4): validate builds ui/dist first.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interface packages
        working-directory: ui
        run: npm ci

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            firmware -> target
            firmware -> target/radio
          shared-key: firmware

      # The Xtensa toolchain espup installs (about 1.4 GB, a minute to download and unpack) and its
      # export file: restored from the cache when espup's version and the firmware's toolchain
      # file have not changed.
      - name: ESP32 toolchain cache
        id: esp-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.cargo/bin/ldproxy
            ~/export-esp.sh
          key: esp-toolchain-${{ runner.os }}-${{ env.ESPUP_VERSION }}-${{ hashFiles('firmware/rust-toolchain.toml') }}

      - name: ESP32 toolchain (espup, ldproxy)
        if: steps.esp-toolchain.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/espup" \
            "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/espup"
          "$RUNNER_TEMP/espup" install --targets esp32 --export-file "$HOME/export-esp.sh"
          cargo install ldproxy --locked

      - name: ESP-IDF download cache
        uses: actions/cache@v4
        with:
          path: firmware/.embuild
          # The exact key changes with Cargo.lock (a version bump does); restore-keys then takes the
          # last download of the same ESP-IDF (its version is in config.toml), D84.
          key: esp-idf-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml') }}-${{ hashFiles('firmware/Cargo.lock') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml') }}-

      # QEMU has its own cache: the ESP-IDF cache key above does not change when QEMU is added, so
      # it would be downloaded on every run. On a miss, scripts/qemu.sh installs it (after the
      # firmware build has downloaded ESP-IDF, which the installer needs) and this step saves it.
      - name: QEMU download cache
        if: env.SKIP_SLOW == '' || github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: firmware/.embuild/espressif/tools/qemu-xtensa
          key: qemu-xtensa-${{ runner.os }}-${{ hashFiles('firmware/.cargo/config.toml') }}

      - name: Validate
        run: sh scripts/validate.sh --only firmware ${SCOPE:-$SKIP_SLOW}
