[package]
name = "solite-core"
description = "The Sowel core of Solite: no hardware dependency, runs on the Mac and on the ESP32."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Script recipes (spec 041): QuickJS through rquickjs, the loader, the shim and `ScriptRecipe`.
# Not a default feature: the firmware's measuring and box images do not carry QuickJS. The host
# program always enables it (its dependency below), so `cargo test --workspace` runs the tests that
# need it (`required-features`); `cargo test -p solite-core` alone skips them.
script-recipes = ["dep:rquickjs", "dep:scoped-tls-hkt"]

[dependencies]
log = "0.4"
# The recipe contract (spec 041); no recipe is built in (spec 046).
solite-recipe-sdk = { path = "../recipe-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Password hash (spec 029, D47): PBKDF2-HMAC-SHA256, no default features (no_std-friendly crates).
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
# The backup archive's cipher (spec 035, D56): ChaCha20, pure Rust, no_std.
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }
# Update signatures (spec 032, D52): verification only, without the precomputed tables (code size).
ed25519-dalek = { version = "3.0", default-features = false }

# QuickJS-ng (about 60 KB per recipe in PSRAM). `parallel`: a runtime that can move between threads
# and resets its stack limit at each call. The version is pinned: the vendored rquickjs-sys (root
# Cargo.toml's [patch.crates-io]) is a copy of this very release.
rquickjs = { version = "=0.14.0", default-features = false, features = ["parallel"], optional = true }

# A borrowed value (the host of one call) reachable from the functions QuickJS calls back, for the
# time of that call and on that thread: a scoped thread-local, with no `unsafe` of ours (the crate
# holds it).
scoped-tls-hkt = { version = "0.1", optional = true }

[dev-dependencies]
peak_alloc = "0.3"
solite-sim = { path = "../sim" }

